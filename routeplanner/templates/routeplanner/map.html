<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Route &amp; fuel stops</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
    #map { height: 100%; }
    #panel { position: absolute; z-index: 1000; top: 12px; right: 12px; width: 300px; max-height: 80%;
             overflow: auto; background: #fff; padding: 12px 14px; border-radius: 8px;
             box-shadow: 0 2px 10px rgba(0,0,0,.25); font-size: 13px; }
    #panel h1 { font-size: 15px; margin: 0 0 6px; }
    #panel li { margin-bottom: 6px; }
    .err { color: #b00020; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="panel">Loading route…</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map');
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18, attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  const panel = document.getElementById('panel');

  fetch('/api/route/?{{ query|escapejs }}')
    .then(r => r.json().then(j => ({ ok: r.ok, j })))
    .then(({ ok, j }) => {
      if (!ok) { panel.innerHTML = '<span class="err">' + (j.error || 'Error') + '</span>'; map.setView([39.5, -98.35], 4); return; }
      const line = L.geoJSON(j.route, { style: { color: '#1565c0', weight: 5 } }).addTo(map);
      map.fitBounds(line.getBounds(), { padding: [30, 30] });
      L.marker([j.start.lat, j.start.lon]).addTo(map).bindPopup('<b>Start</b><br>' + j.start.resolved);
      L.marker([j.finish.lat, j.finish.lon]).addTo(map).bindPopup('<b>Finish</b><br>' + j.finish.resolved);
      let items = '';
      j.fuel_stops.forEach(s => {
        L.circleMarker([s.location.lat, s.location.lon], { radius: 9, color: '#c62828', fillOpacity: .9 })
          .addTo(map)
          .bindPopup('<b>' + s.stop + '. ' + s.name + '</b><br>' + s.city + ', ' + s.state +
                     '<br>$' + s.price_per_gallon.toFixed(3) + '/gal · ' + s.gallons_purchased + ' gal = $' + s.cost.toFixed(2));
        items += '<li><b>' + s.stop + '. ' + s.name + '</b><br>' + s.city + ', ' + s.state +
                 '<br>mile ' + s.mile_marker + ' · $' + s.price_per_gallon.toFixed(3) + '/gal · ' +
                 s.gallons_purchased + ' gal = <b>$' + s.cost.toFixed(2) + '</b></li>';
      });
      panel.innerHTML = '<h1>' + j.total_distance_miles + ' miles · total fuel $' + j.summary.total_fuel_cost.toFixed(2) + '</h1>' +
        (items ? '<ol style="padding-left:18px;margin:6px 0">' + items + '</ol>' : '<p>No fuel stops needed (within range).</p>');
    })
    .catch(e => { panel.innerHTML = '<span class="err">' + e + '</span>'; });
</script>
</body>
</html>
