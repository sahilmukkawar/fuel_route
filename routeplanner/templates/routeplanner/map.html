<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fuel Route Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      color-scheme: light;
      --page:           #f9f9f7;
      --surface:        #fcfcfb;
      --text-primary:   #0b0b0b;
      --text-secondary: #52514e;
      --muted:          #898781;
      --grid:           #e1e0d9;
      --series-1:       #2a78d6;
      --critical:       #d03b3b;
      --border:         #e1e0d9;
    }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) {
        color-scheme: dark;
        --page:           #0d0d0d;
        --surface:        #1a1a19;
        --text-primary:   #ffffff;
        --text-secondary: #c3c2b7;
        --muted:          #898781;
        --grid:           #2c2c2a;
        --series-1:       #3987e5;
        --critical:       #e66767;
        --border:         #2c2c2a;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page:           #0d0d0d;
      --surface:        #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --muted:          #898781;
      --grid:           #2c2c2a;
      --series-1:       #3987e5;
      --critical:       #e66767;
      --border:         #2c2c2a;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--page); color: var(--text-primary);
      display: grid; grid-template-columns: 370px 1fr;
    }

    /* ---------- sidebar ---------- */
    #side {
      background: var(--surface); border-right: 1px solid var(--border);
      overflow-y: auto; padding: 18px 18px 28px;
    }
    h1 { font-size: 16px; margin: 0 0 2px; letter-spacing: -.01em; }
    .tagline { color: var(--text-secondary); font-size: 12.5px; margin: 0 0 16px; }
    h2 {
      font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
      color: var(--muted); margin: 22px 0 8px; font-weight: 600;
    }
    label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 3px; }
    input {
      width: 100%; padding: 7px 9px; font: inherit; font-size: 13px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--page); color: var(--text-primary); margin-bottom: 9px;
    }
    input:focus { outline: 2px solid var(--series-1); outline-offset: -1px; }
    button {
      width: 100%; padding: 9px; font: inherit; font-weight: 600; font-size: 13px;
      color: #fff; background: var(--series-1); border: 0; border-radius: 6px; cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: default; }
    .examples { margin-top: 10px; font-size: 12px; color: var(--text-secondary); }
    .examples a { color: var(--series-1); cursor: pointer; text-decoration: none; margin-right: 9px; }
    .examples a:hover { text-decoration: underline; }

    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .card { border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; }
    .card .k { font-size: 11px; color: var(--muted); }
    .card .v { font-size: 17px; font-weight: 650; letter-spacing: -.02em; margin-top: 1px; }
    .card .v small { font-size: 11px; font-weight: 500; color: var(--text-secondary); }

    table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
    th {
      text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .03em;
      color: var(--muted); font-weight: 600; padding: 0 0 5px 7px;
      border-bottom: 1px solid var(--border);
    }
    td { padding: 6px 0 6px 7px; border-bottom: 1px solid var(--grid); vertical-align: top; }
    th:first-child, td:first-child { padding-left: 0; width: 24px; }
    th.n, td.n { text-align: right; font-variant-numeric: tabular-nums; }
    th.mile, td.mile { width: 38px; }
    th.price, td.price { width: 42px; }
    th.gal, td.gal { width: 36px; }
    th.cost, td.cost { width: 52px; }
    .stationname { font-weight: 550; overflow-wrap: anywhere; }
    .stationsub { color: var(--muted); font-size: 11px; }
    .idx {
      display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%;
      background: var(--series-1); color: #fff; font-size: 10.5px; font-weight: 700;
    }
    .note { color: var(--text-secondary); font-size: 12px; }
    .banner {
      border-left: 3px solid var(--critical); background: var(--page);
      padding: 9px 11px; border-radius: 0 6px 6px 0; font-size: 12.5px; margin-bottom: 14px;
    }
    .banner b { color: var(--critical); }

    /* ---------- main ---------- */
    #main { display: grid; grid-template-rows: minmax(260px, 1fr) auto; min-width: 0; }
    #map { width: 100%; height: 100%; background: var(--page); }
    #mapwrap { position: relative; min-height: 0; }
    #charts {
      border-top: 1px solid var(--border); background: var(--surface);
      padding: 12px 16px 16px; display: grid; gap: 10px;
    }
    .chart-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .chart-title { font-size: 12.5px; font-weight: 600; }
    .chart-sub { font-size: 11.5px; color: var(--muted); }
    .legend { display: flex; gap: 13px; margin-left: auto; font-size: 11.5px; color: var(--text-secondary); }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .swatch { width: 9px; height: 9px; border-radius: 50%; }
    svg { display: block; width: 100%; overflow: visible; }
    .maptoggle {
      position: absolute; z-index: 500; bottom: 10px; left: 10px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px;
      font-size: 11.5px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px;
      margin: 0; cursor: pointer;
    }
    .maptoggle input { width: auto; margin: 0; }

    #tip {
      position: fixed; z-index: 2000; pointer-events: none; opacity: 0;
      background: var(--surface); color: var(--text-primary);
      border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px;
      font-size: 11.5px; line-height: 1.4; box-shadow: 0 3px 12px rgba(0,0,0,.18);
      max-width: 230px; transition: opacity .08s;
    }

    @media (max-width: 860px) {
      body { grid-template-columns: 1fr; grid-template-rows: auto auto; }
      #side { border-right: 0; border-bottom: 1px solid var(--border); }
      #mapwrap { height: 320px; }
    }
  </style>
</head>
<body>

<aside id="side">
  <h1>Fuel Route Planner</h1>
  <p class="tagline">Cheapest fuel stops for a 500-mile range at 10&nbsp;mpg.</p>

  <form id="form" autocomplete="off">
    <label for="start">Start</label>
    <input id="start" name="start" placeholder="Dallas, TX  or  32.78,-96.80" required>
    <label for="finish">Finish</label>
    <input id="finish" name="finish" placeholder="Chicago, IL  or  41.88,-87.63" required>
    <label for="tank">Range in tank at departure (miles)</label>
    <input id="tank" name="start_fuel_miles" type="number" min="0" max="500" placeholder="500 (full)">
    <button id="go" type="submit">Plan route</button>
  </form>
  <p class="examples">
    Try:
    <a data-s="Los Angeles, CA" data-f="New York, NY">LA &rarr; NY</a>
    <a data-s="Dallas, TX" data-f="Chicago, IL">Dallas &rarr; Chicago</a>
    <a data-s="Seattle, WA" data-f="Miami, FL">Seattle &rarr; Miami</a>
  </p>

  <div id="out"></div>
</aside>

<div id="main">
  <div id="mapwrap">
    <div id="map"></div>
    <label class="maptoggle" id="candtoggle" hidden>
      <input type="checkbox" id="showcand" checked> Show stations considered
    </label>
  </div>
  <div id="charts" hidden>
    <div>
      <div class="chart-head">
        <span class="chart-title">Fuel price along the route</span>
        <span class="chart-sub">every station in the search corridor</span>
        <span class="legend">
          <span><i class="swatch" style="background:var(--muted);opacity:.55"></i>Considered</span>
          <span><i class="swatch" style="background:var(--series-1)"></i>Bought here</span>
        </span>
      </div>
      <svg id="pricechart" role="img" aria-label="Fuel price per gallon against distance along the route"></svg>
    </div>
    <div>
      <div class="chart-head">
        <span class="chart-title">Fuel in tank</span>
        <span class="chart-sub">drains while driving, refills at each stop</span>
      </div>
      <svg id="tankchart" role="img" aria-label="Gallons of fuel in the tank against distance along the route"></svg>
    </div>
  </div>
</div>

<div id="tip"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  "use strict";

  function $(id) { return document.getElementById(id); }
  var form = $("form"), out = $("out"), tip = $("tip");
  var SVG_NS = "http://www.w3.org/2000/svg";
  var USA_CENTER = [39.5, -98.35], USA_ZOOM = 4;
  var data = null, candLayer = null;

  /* ---------------- map ---------------- */
  var map = L.map("map").setView(USA_CENTER, USA_ZOOM);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18, attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);
  var drawn = L.layerGroup().addTo(map);

  function token(name) {
    return getComputedStyle(document.body).getPropertyValue(name).trim();
  }

  /* ---------------- helpers ---------------- */
  function el(tag, attrs, text) {
    var n = document.createElementNS(SVG_NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }
  function money(v) { return "$" + v.toFixed(2); }
  function scale(d0, d1, r0, r1) {
    var span = (d1 - d0) || 1;
    return function (v) { return r0 + (v - d0) / span * (r1 - r0); };
  }
  function ticks(lo, hi, count) {
    var raw = (hi - lo) / count;
    if (raw <= 0) return [lo];
    var mag = Math.pow(10, Math.floor(Math.log10(raw)));
    var step = mag * 10;
    [1, 2, 2.5, 5, 10].forEach(function (m) {
      if (m * mag >= raw && m * mag < step) step = m * mag;
    });
    var res = [];
    for (var v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) res.push(v);
    return res;
  }
  function showTip(html, ev) {
    tip.innerHTML = html;
    tip.style.opacity = 1;
    var pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
    var x = ev.clientX + pad, y = ev.clientY - h - 8;
    if (x + w > window.innerWidth - 6) x = ev.clientX - w - pad;
    if (y < 6) y = ev.clientY + pad;
    tip.style.left = x + "px";
    tip.style.top = y + "px";
  }
  function hideTip() { tip.style.opacity = 0; }
  function hoverable(node, html) {
    node.addEventListener("mouseenter", function (ev) { showTip(html, ev); });
    node.addEventListener("mousemove", function (ev) { showTip(html, ev); });
    node.addEventListener("mouseleave", hideTip);
  }
  document.addEventListener("scroll", hideTip, true);

  /* ---------------- charts ---------------- */
  var M = { t: 12, r: 16, b: 26, l: 50 };

  function frame(svg, height, xs, xTicks, ys, yTicks, yFmt) {
    svg.textContent = "";
    var w = svg.clientWidth || svg.parentNode.clientWidth || 620;
    svg.setAttribute("height", height);
    var g = el("g", {});
    yTicks.forEach(function (t) {
      var y = ys(t);
      g.appendChild(el("line", {
        x1: M.l, x2: w - M.r, y1: y, y2: y, stroke: "var(--grid)", "stroke-width": 1
      }));
      g.appendChild(el("text", {
        x: M.l - 7, y: y + 3.5, "text-anchor": "end", fill: "var(--muted)", "font-size": 10.5
      }, yFmt(t)));
    });
    xTicks.forEach(function (t) {
      g.appendChild(el("text", {
        x: xs(t), y: height - M.b + 15, "text-anchor": "middle",
        fill: "var(--muted)", "font-size": 10.5
      }, Math.round(t).toLocaleString()));
    });
    g.appendChild(el("line", {
      x1: M.l, x2: w - M.r, y1: height - M.b, y2: height - M.b,
      stroke: "var(--grid)", "stroke-width": 1
    }));
    g.appendChild(el("text", {
      x: w - M.r, y: height - 1, "text-anchor": "end", fill: "var(--muted)", "font-size": 10
    }, "mile"));
    svg.appendChild(g);
    return { g: g, w: w };
  }

  function drawPriceChart() {
    var svg = $("pricechart"), H = 190;
    var cands = data.candidates || [], stops = data.fuel_stops;
    var total = data.total_distance_miles;

    var prices = cands.map(function (c) { return c.price; });
    stops.forEach(function (s) { prices.push(s.price_per_gallon); });
    if (!prices.length) prices = [3, 4];
    var pLo = Math.min.apply(null, prices), pHi = Math.max.apply(null, prices);
    var pad = (pHi - pLo) * 0.12 || 0.2;

    var w0 = svg.clientWidth || svg.parentNode.clientWidth || 620;
    var xs = scale(0, total, M.l, w0 - M.r);
    var ys = scale(pLo - pad, pHi + pad, H - M.b, M.t);
    var g = frame(svg, H, xs, ticks(0, total, 6), ys,
      ticks(pLo - pad, pHi + pad, 4), function (v) { return "$" + v.toFixed(2); }).g;

    cands.forEach(function (c) {
      var dot = el("circle", {
        cx: xs(c.mile), cy: ys(c.price), r: 3, fill: "var(--muted)", "fill-opacity": .5
      });
      hoverable(dot, "<b>" + c.name + "</b><br>" + c.city + ", " + c.state +
        "<br>$" + c.price.toFixed(3) + "/gal &middot; mile " + Math.round(c.mile) +
        "<br>" + c.off_route_miles.toFixed(1) + " mi off route");
      g.appendChild(dot);
    });

    if (stops.length > 1) {
      g.appendChild(el("polyline", {
        points: stops.map(function (s) {
          return xs(s.mile_marker) + "," + ys(s.price_per_gallon);
        }).join(" "),
        fill: "none", stroke: "var(--series-1)", "stroke-width": 2,
        "stroke-opacity": .4, "stroke-dasharray": "4 3"
      }));
    }

    stops.forEach(function (s) {
      var cx = xs(s.mile_marker), cy = ys(s.price_per_gallon);
      g.appendChild(el("circle", {
        cx: cx, cy: cy, r: 6.5, fill: "var(--series-1)",
        stroke: "var(--surface)", "stroke-width": 2
      }));
      g.appendChild(el("text", {
        x: cx, y: cy - 12, "text-anchor": "middle",
        fill: "var(--text-secondary)", "font-size": 10, "font-weight": 650
      }, s.stop));
      var hit = el("circle", { cx: cx, cy: cy, r: 13, fill: "transparent" });
      hoverable(hit, "<b>" + s.stop + ". " + s.name + "</b><br>" + s.city + ", " + s.state +
        "<br>$" + s.price_per_gallon.toFixed(3) + "/gal &middot; " +
        s.gallons_purchased.toFixed(1) + " gal<br>= <b>" + money(s.cost) + "</b>");
      g.appendChild(hit);
    });
  }

  function tankPoints() {
    var mpg = data.vehicle.mpg, cap = data.vehicle.tank_gallons;
    var startParam = new URLSearchParams(location.search).get("start_fuel_miles");
    var fuel = (startParam === null || startParam === "") ? cap : Number(startParam) / mpg;
    var pts = [{ mile: 0, gal: fuel }];
    var prev = 0;
    data.fuel_stops.forEach(function (s) {
      fuel -= (s.mile_marker - prev) / mpg;
      pts.push({ mile: s.mile_marker, gal: Math.max(fuel, 0), arrive: true, stop: s });
      fuel += s.gallons_purchased;
      pts.push({ mile: s.mile_marker, gal: fuel });
      prev = s.mile_marker;
    });
    fuel -= (data.total_distance_miles - prev) / mpg;
    pts.push({ mile: data.total_distance_miles, gal: Math.max(fuel, 0) });
    return pts;
  }

  function drawTankChart() {
    var svg = $("tankchart"), H = 150;
    var cap = data.vehicle.tank_gallons, total = data.total_distance_miles;
    var pts = tankPoints();
    var w0 = svg.clientWidth || svg.parentNode.clientWidth || 620;
    var xs = scale(0, total, M.l, w0 - M.r);
    var ys = scale(0, cap * 1.12, H - M.b, M.t);
    var f = frame(svg, H, xs, ticks(0, total, 6), ys, [0, cap / 2, cap],
      function (v) { return v.toFixed(0) + " gal"; });
    var g = f.g;

    g.appendChild(el("line", {
      x1: M.l, x2: f.w - M.r, y1: ys(cap), y2: ys(cap),
      stroke: "var(--muted)", "stroke-width": 1, "stroke-dasharray": "3 3"
    }));
    g.appendChild(el("text", {
      x: M.l + 5, y: ys(cap) - 5, fill: "var(--muted)", "font-size": 10
    }, "tank full (" + cap.toFixed(0) + " gal)"));

    g.appendChild(el("polyline", {
      points: pts.map(function (p) { return xs(p.mile) + "," + ys(p.gal); }).join(" "),
      fill: "none", stroke: "var(--series-1)", "stroke-width": 2, "stroke-linejoin": "round"
    }));

    pts.forEach(function (p) {
      if (!p.arrive) return;
      var cx = xs(p.mile), cy = ys(p.gal);
      g.appendChild(el("circle", {
        cx: cx, cy: cy, r: 4.5, fill: "var(--series-1)",
        stroke: "var(--surface)", "stroke-width": 2
      }));
      var hit = el("circle", { cx: cx, cy: cy, r: 12, fill: "transparent" });
      hoverable(hit, "<b>Stop " + p.stop.stop + "</b> &middot; mile " + Math.round(p.mile) +
        "<br>arrives with " + p.gal.toFixed(1) + " gal<br>buys " +
        p.stop.gallons_purchased.toFixed(1) + " gal");
      g.appendChild(hit);
    });
  }

  function drawCharts() {
    if (!data) return;
    $("charts").hidden = false;
    drawPriceChart();
    drawTankChart();
  }

  /* ---------------- sidebar ---------------- */
  function card(k, v, sub) {
    return "<div class='card'><div class='k'>" + k + "</div><div class='v'>" + v +
      (sub ? " <small>" + sub + "</small>" : "") + "</div></div>";
  }

  function renderSidebar() {
    var s = data.summary, stops = data.fuel_stops;
    var avg = s.gallons_purchased ? s.total_fuel_cost / s.gallons_purchased : 0;

    var html = "<h2>Trip</h2><div class='cards'>" +
      card("Distance", data.total_distance_miles.toLocaleString(), "mi") +
      card("Total fuel cost", money(s.total_fuel_cost)) +
      card("Fuel stops", String(stops.length)) +
      card("Bought", s.gallons_purchased.toFixed(1), "gal") +
      card("Avg paid", avg ? "$" + avg.toFixed(3) : "&mdash;", avg ? "/gal" : "") +
      card("Drive time", data.estimated_drive_hours.toFixed(1), "h") +
      "</div>";

    if (stops.length) {
      html += "<h2>Where to buy</h2><table><thead><tr><th>#</th><th>Station</th>" +
        "<th class='n mile'>Mile</th><th class='n price'>$/gal</th>" +
        "<th class='n gal'>Gal</th><th class='n cost'>Cost</th></tr></thead><tbody>";
      stops.forEach(function (st) {
        html += "<tr><td><span class='idx'>" + st.stop + "</span></td>" +
          "<td><div class='stationname'>" + st.name + "</div>" +
          "<div class='stationsub'>" + st.city + ", " + st.state + "</div></td>" +
          "<td class='n mile'>" + Math.round(st.mile_marker) + "</td>" +
          "<td class='n price'>" + st.price_per_gallon.toFixed(3) + "</td>" +
          "<td class='n gal'>" + st.gallons_purchased.toFixed(1) + "</td>" +
          "<td class='n cost'>" + money(st.cost) + "</td></tr>";
      });
      html += "</tbody></table>";
    } else {
      html += "<p class='note'>No fuel stops needed &mdash; the whole trip fits in one tank.</p>";
    }

    html += "<h2>How this was worked out</h2><p class='note'>" +
      data.meta.candidate_stations_in_corridor.toLocaleString() + " stations lie within " +
      data.meta.corridor_miles_used + " miles of the route. The planner drives to the nearest " +
      "cheaper station, buying only the fuel needed to reach it &mdash; or just enough to arrive. " +
      data.meta.external_api_calls.routing + " routing and " +
      data.meta.external_api_calls.geocoding + " geocoding call(s), " +
      Math.round(data.meta.compute_ms) + " ms.</p>";

    out.innerHTML = html;
  }

  /* ---------------- map drawing ---------------- */
  function renderMap() {
    drawn.clearLayers();
    var accent = token("--series-1"), muted = token("--muted"), surface = token("--surface");

    candLayer = L.layerGroup();
    (data.candidates || []).forEach(function (c) {
      L.circleMarker([c.lat, c.lon], {
        radius: 3, color: muted, weight: 1, opacity: .5, fillColor: muted, fillOpacity: .35
      }).bindTooltip(c.name + " &middot; $" + c.price.toFixed(3), { direction: "top" })
        .addTo(candLayer);
    });
    $("candtoggle").hidden = false;
    if ($("showcand").checked) candLayer.addTo(drawn);

    if (data.route) {
      var line = L.geoJSON(data.route, { style: { color: accent, weight: 5, opacity: .9 } });
      line.addTo(drawn);
      map.fitBounds(line.getBounds(), { padding: [30, 30] });
    } else {
      map.fitBounds([[data.start.lat, data.start.lon], [data.finish.lat, data.finish.lon]],
        { padding: [40, 40] });
    }

    L.marker([data.start.lat, data.start.lon]).addTo(drawn)
      .bindPopup("<b>Start</b><br>" + data.start.resolved);
    L.marker([data.finish.lat, data.finish.lon]).addTo(drawn)
      .bindPopup("<b>Finish</b><br>" + data.finish.resolved);

    data.fuel_stops.forEach(function (s) {
      L.circleMarker([s.location.lat, s.location.lon], {
        radius: 8, weight: 2, color: surface, fillColor: accent, fillOpacity: 1
      }).addTo(drawn).bindPopup("<b>" + s.stop + ". " + s.name + "</b><br>" +
        s.city + ", " + s.state + "<br>$" + s.price_per_gallon.toFixed(3) + "/gal &middot; " +
        s.gallons_purchased.toFixed(1) + " gal = " + money(s.cost));
    });
  }

  $("showcand").addEventListener("change", function () {
    if (!candLayer) return;
    if (this.checked) candLayer.addTo(drawn); else drawn.removeLayer(candLayer);
  });

  /* ---------------- load ---------------- */
  function setBusy(on) {
    $("go").disabled = on;
    $("go").textContent = on ? "Planning…" : "Plan route";
  }

  function load(qs) {
    setBusy(true);
    out.innerHTML = "<p class='note'>Routing and pricing…</p>";
    var params = new URLSearchParams(qs);
    params.set("include_candidates", "true");
    fetch("/api/route/?" + params.toString())
      .then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, j: j }; });
      })
      .then(function (res) {
        setBusy(false);
        if (!res.ok) {
          data = null;
          $("charts").hidden = true;
          drawn.clearLayers();
          $("candtoggle").hidden = true;
          map.setView(USA_CENTER, USA_ZOOM);
          out.innerHTML = "<div class='banner'><b>Could not plan this route.</b><br>" +
            (res.j.error || "Unknown error") + "</div>";
          return;
        }
        data = res.j;
        renderSidebar();
        renderMap();
        drawCharts();
      })
      .catch(function (e) {
        setBusy(false);
        out.innerHTML = "<div class='banner'><b>Request failed.</b><br>" + e + "</div>";
      });
  }

  function emptyState() {
    out.innerHTML = "<p class='note'>Enter a start and a finish to see the route, the " +
      "cheapest places to buy fuel along it, and what the trip costs.</p>";
  }

  function submitQuery(start, finish, tankMiles) {
    var p = new URLSearchParams();
    p.set("start", start);
    p.set("finish", finish);
    if (tankMiles) p.set("start_fuel_miles", tankMiles);
    history.pushState(null, "", "/map/?" + p.toString());
    load(p.toString());
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    submitQuery($("start").value.trim(), $("finish").value.trim(), $("tank").value.trim());
  });

  Array.prototype.forEach.call(document.querySelectorAll(".examples a"), function (a) {
    a.addEventListener("click", function () {
      $("start").value = a.dataset.s;
      $("finish").value = a.dataset.f;
      $("tank").value = "";
      submitQuery(a.dataset.s, a.dataset.f, "");
    });
  });

  window.addEventListener("popstate", boot);

  var rt;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(drawCharts, 150);
  });

  function boot() {
    var p = new URLSearchParams(location.search);
    $("start").value = p.get("start") || "";
    $("finish").value = p.get("finish") || "";
    $("tank").value = p.get("start_fuel_miles") || "";
    if (p.get("start") && p.get("finish")) {
      load(p.toString());
    } else {
      emptyState();
      map.setView(USA_CENTER, USA_ZOOM);
    }
  }

  boot();
})();
</script>
</body>
</html>
